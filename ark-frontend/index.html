<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e8" />

    <title>Tentzu — Never let rent day catch you off guard</title>
    <meta
      name="description"
      content="Tentzu keeps your rent date, amount, and obligations in view before they become stressful. Join the waitlist for early access."
    />

    <!-- Link previews. The referral flow exists to be shared on WhatsApp, so an
         absolute og:image and a real title are part of the feature, not polish.
         __SITE_URL__ is substituted with the live origin at deploy time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tentzu" />
    <meta property="og:title" content="Tentzu — Never let rent day catch you off guard" />
    <meta
      property="og:description"
      content="Rent reminders for calmer renting. Join the waitlist and be first in when we launch."
    />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:url" content="__SITE_URL__/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tentzu — Never let rent day catch you off guard" />
    <meta
      name="twitter:description"
      content="Rent reminders for calmer renting. Join the waitlist and be first in when we launch."
    />
    <meta name="twitter:image" content="__SITE_URL__/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
