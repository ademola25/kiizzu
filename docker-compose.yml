services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ark
      POSTGRES_PASSWORD: ark
      POSTGRES_DB: ark
    ports:
      - "5432:5432"
    volumes:
      - ark_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ark"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./ark-backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./ark-backend:/app
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgres://ark:ark@postgres:5432/ark
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:5174
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: ./ark-backend
    command: celery -A config.celery_app worker --loglevel=info
    volumes:
      - ./ark-backend:/app
    environment:
      DATABASE_URL: postgres://ark:ark@postgres:5432/ark
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      - postgres
      - redis

  celery-beat:
    build: ./ark-backend
    command: celery -A config.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./ark-backend:/app
    environment:
      DATABASE_URL: postgres://ark:ark@postgres:5432/ark
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./ark-frontend:/app
    ports:
      - "5174:5173"
    environment:
      VITE_API_URL: http://localhost:8001/api/v1

volumes:
  ark_postgres_data:
