# Render Blueprint for the Tentzu backend (ark-backend).
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Free tier: the web service cold-starts after inactivity, and the free Postgres
# expires ~30 days after creation (fine for team testing).
databases:
  - name: tentzu-db
    databaseName: tentzu
    user: tentzu
    plan: free

services:
  - type: web
    name: tentzu-api
    runtime: python
    plan: free
    rootDir: ark-backend
    buildCommand: "pip install -r requirements/production.txt && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tentzu-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # TEST ONLY — lets testers verify email via the on-screen code without a
      # mail provider. Set to "false" once SENDGRID_API_KEY is configured.
      - key: EXPOSE_OTP_CODES
        value: "true"
      # Sender address. Dashboard-managed (sync: false) rather than a literal,
      # because it MUST match whatever the mail provider has verified — Gmail
      # SMTP rejects/rewrites any From that isn't the authenticated account.
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Email delivery. Set EITHER the SMTP trio (any provider: Gmail app
      # password, Resend, Mailgun…) OR SENDGRID_API_KEY. With neither set,
      # production falls back to the console backend and codes reach testers
      # only via the EXPOSE_OTP_CODES response field.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Fill these in the Render dashboard when ready (kept out of the repo):
      # Resend is the preferred provider — outbound SMTP is blocked on this
      # host, so only an HTTPS-API provider can deliver.
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # Reminders are a once-a-day batch, so they run as a scheduled command rather
  # than a Celery worker + Redis. Nothing in the codebase calls .delay(); the
  # broker existed to run this one job. A cron job also ports directly to a
  # VPS crontab if the backend ever moves off Render.
  - type: cron
    name: tentzu-reminders
    runtime: python
    plan: starter
    rootDir: ark-backend
    # 04:00 UTC daily. The sweep measures each window against the tenant's own
    # local day, so the fire time only decides what hour the message lands in.
    schedule: "0 4 * * *"
    buildCommand: "pip install -r requirements/production.txt"
    startCommand: "python manage.py send_reminders"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      # Shared with the web service rather than generated: a second random key
      # would not match anything the API signed.
      - key: DJANGO_SECRET_KEY
        fromService:
          name: tentzu-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: tentzu-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
